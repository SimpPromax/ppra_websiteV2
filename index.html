<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/commonPics/3d ppra transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPRA - Public Procurement Regulatory Authority</title>
    <meta name="description" content="Promoting integrity, transparency and value for money in public procurement across all government entities." />
  </head>
  <body>
    <!-- SVG filters for colorblind modes -->
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;" aria-hidden="true">
      <defs>
        <!-- Protanopia (Red-Blind) -->
        <filter id="protanopia">
          <feColorMatrix type="matrix" values="
            0.567, 0.433, 0, 0, 0,
            0.558, 0.442, 0, 0, 0,
            0, 0.242, 0.758, 0, 0,
            0, 0, 0, 1, 0
          " />
        </filter>
        
        <!-- Deuteranopia (Green-Blind) -->
        <filter id="deuteranopia">
          <feColorMatrix type="matrix" values="
            0.625, 0.375, 0, 0, 0,
            0.7, 0.3, 0, 0, 0,
            0, 0.3, 0.7, 0, 0,
            0, 0, 0, 1, 0
          " />
        </filter>
        
        <!-- Tritanopia (Blue-Blind) -->
        <filter id="tritanopia">
          <feColorMatrix type="matrix" values="
            0.95, 0.05, 0, 0, 0,
            0, 0.433, 0.567, 0, 0,
            0, 0.475, 0.525, 0, 0,
            0, 0, 0, 1, 0
          " />
        </filter>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
